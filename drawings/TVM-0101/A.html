// Het ingevoegde net (posities en driehoeken als base64) als BufferGeometry met vlakke normalen.
function meshGeometry(THREE) {
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(bytes(MESH.pos)), 3));
  g.setIndex(new THREE.BufferAttribute(MESH.idx32 ? new Uint32Array(bytes(MESH.idx)) : new Uint16Array(bytes(MESH.idx)), 1));
  const flat = g.toNonIndexed();
  flat.computeVertexNormals();
  return flat;
}

// Omtrek plus arcering onder 45° van veelhoeken [y, z] in het vlak x (even-oneven regel, dus ook losse latjes).
function hatchYZ(V, x, polys, step) {
  const pts = [], Q = (y, z) => V(x + 0.05, y, z);
  const edges = [];
  polys.forEach(p => p.forEach((a, i) => edges.push([a, p[(i + 1) % p.length]])));
  edges.forEach(([a, b]) => pts.push(Q(a[0], a[1]), Q(b[0], b[1])));
  const cs = edges.map(([a]) => a[1] - a[0]), cMin = Math.min(...cs), cMax = Math.max(...cs);
  for (let c = cMin + step / 2; c < cMax; c += step) {           // lijn z - y = c
    const ys = [];
    edges.forEach(([[y0, z0], [y1, z1]]) => {
      const f0 = z0 - y0 - c, f1 = z1 - y1 - c;
      if ((f0 < 0) !== (f1 < 0)) { const s = f0 / (f0 - f1); ys.push(y0 + s * (y1 - y0)); }
    });
    ys.sort((p, q) => p - q);
    for (let k = 0; k + 1 < ys.length; k += 2) pts.push(Q(ys[k], ys[k] + c), Q(ys[k + 1], ys[k + 1] + c));
  }
  return pts;
}
