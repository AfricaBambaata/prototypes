      ext: [hide(V(A - P.bevelLen, L, -T - 40), Z), [V(A - P.bevelLen, L, -T), V(A - P.bevelLen, L, -T - 46)], [V(A, L, -P.endT), V(A, L, -T - 46)]] });
    const bm = V(A - P.bevelLen / 2, L, -(T + P.endT) / 2);           // midden van de afschuining, bovenaan
    all.leader({ p: bm, e: bm.clone().add(V(28, 0, -70)), n: Y, text: '20°' });
    all.note({ pos: V(0, -150, 0), text: `${P.gN} groeven ${P.gW} × ${P.gDepth} · steek ${P.gW + P.gLand}` });

    // Detail: groeven en uiteinde (ingezoomd)
    const det = m.dims({ parent: g, arrow: 3, maxRadius: 700 });
    const X = A, g1 = gTop, g2 = gTop + P.gW, g0b = gTop - P.gLand;
    det.linear({ a: V(X, g1, 14), b: V(X, g2, 14), n: V(1, 0, 0), text: String(P.gW),
      ext: [[V(X, g1, 0), V(X, g1, 18)], [V(X, g2, 0), V(X, g2, 18)]] });
    det.linear({ a: V(X, g0b, 14), b: V(X, g1, 14), n: V(1, 0, 0), text: String(P.gLand),
      ext: [[V(X, g0b, 0), V(X, g0b, 18)]] });
    det.linear({ a: V(X, L + 14, 0), b: V(X, L + 14, -P.gDepth), n: V(1, 0, 0), text: String(P.gDepth),
      ext: [[V(X, L, 0), V(X, L + 18, 0)], [V(X, g2, -P.gDepth), V(X, L + 18, -P.gDepth)]] });
    // Inkeping bovenaan (85 × 5, van voor tot achter)
    det.linear({ a: V(-P.nW / 2, L + 12, 0), b: V(P.nW / 2, L + 12, 0), text: String(P.nW),
      ext: [hide(V(-P.nW / 2, L + 12, 0), Y), [V(-P.nW / 2, L - P.nDepth, 0), V(-P.nW / 2, L + 16, 0)], [V(P.nW / 2, L - P.nDepth, 0), V(P.nW / 2, L + 16, 0)]] });
    det.linear({ a: V(P.nW / 2 + 14, L - P.nDepth, 0), b: V(P.nW / 2 + 14, L, 0), text: String(P.nDepth),
      ext: [[V(P.nW / 2, L - P.nDepth, 0), V(P.nW / 2 + 18, L - P.nDepth, 0)], [V(P.nW / 2, L, 0), V(P.nW / 2 + 18, L, 0)]] });
    det.linear({ a: V(X + 14, L, 0), b: V(X + 14, L, -P.endT), n: V(0, 1, 0), text: String(P.endT),
      ext: [[V(X, L, 0), V(X + 18, L, 0)], [V(X, L, -P.endT), V(X + 18, L, -P.endT)]] });

    // Hoogte (vooraanzicht links, zijaanzicht rechts)
    all.linear({ a: V(-A - 70, 0, 0), b: V(-A - 70, L, 0), text: String(L),
      ext: [[V(-A, 0, 0), V(-A - 78, 0, 0)], [V(-A, L, 0), V(-A - 78, L, 0)]] });
    all.linear({ a: V(A, 0, 70), b: V(A, L, 70), n: V(1, 0, 0), text: String(L),
      ext: [[V(A, 0, 0), V(A, 0, 76)], [V(A, L, 0), V(A, L, 76)]] });
  }
});

// Het ingevoegde net (posities en driehoeken als base64) als BufferGeometry met vlakke normalen.
function meshGeometry(THREE) {
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(bytes(MESH.pos)), 3));
  g.setIndex(new THREE.BufferAttribute(MESH.idx32 ? new Uint32Array(bytes(MESH.idx)) : new Uint16Array(bytes(MESH.idx)), 1));
  const flat = g.toNonIndexed();
  flat.computeVertexNormals();
  return flat;
}

// Omtrek plus arcering onder 45° van veelhoeken [y, z] in het vlak x (even-oneven regel, dus ook losse latjes).
function hatchYZ(V, x, polys, step) {
  const pts = [], Q = (y, z) => V(x + 0.05, y, z);
  const edges = [];
  polys.forEach(p => p.forEach((a, i) => edges.push([a, p[(i + 1) % p.length]])));
  edges.forEach(([a, b]) => pts.push(Q(a[0], a[1]), Q(b[0], b[1])));
  const cs = edges.map(([a]) => a[1] - a[0]), cMin = Math.min(...cs), cMax = Math.max(...cs);
  for (let c = cMin + step / 2; c < cMax; c += step) {           // lijn z - y = c
    const ys = [];
    edges.forEach(([[y0, z0], [y1, z1]]) => {
      const f0 = z0 - y0 - c, f1 = z1 - y1 - c;
      if ((f0 < 0) !== (f1 < 0)) { const s = f0 / (f0 - f1); ys.push(y0 + s * (y1 - y0)); }
    });
    ys.sort((p, q) => p - q);
    for (let k = 0; k + 1 < ys.length; k += 2) pts.push(Q(ys[k], ys[k] + c), Q(ys[k + 1], ys[k + 1] + c));
  }
  return pts;
}
