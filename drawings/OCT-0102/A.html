<script src="../../viewer/1/viewer.js"></script>
<script>
// Sleutel met achtkantgreep zonder aanslag OCT-0102-A (mm): variant van OCT-0101 zonder schijfje.
// Eén lijn langs X: achtkant (x 0–20), as Ø8 (x 20–60), vierkant 8 × 8 (x 60–100). Platte vlakken van de achtkant boven, onder en opzij.
const OCT = { af: 20, len: 20 };          // sleutelwijdte (tussen evenwijdige vlakken) en diepte
const SHAFT = { d: 8, len: 40 };          // ronde as
const BAR = { w: 8, len: 40 };            // vierkante staaf
const RC = OCT.af / 2 / Math.cos(Math.PI / 8);   // 10,82: straal over de hoeken
const X1 = OCT.len, X2 = X1 + SHAFT.len, X3 = X2 + BAR.len;   // 20, 60, 100
const H = OCT.af / 2, rs = SHAFT.d / 2, hb = BAR.w / 2;

DrawingViewer.create({
  lang: 'nl',
  title: 'Sleutel met achtkantgreep zonder aanslag',
  subtitle: 'achtkant SW 20 × 20 · as Ø8 × 40 · vierkant 8 × 8 × 40 · zonder aanslag · messing',
  number: 'OCT-0102-A',
  register: { url: '../../drawings.json', number: 'OCT-0102', rev: 'A' },
  // Messing, in dezelfde kleuren als de trapleuning (MHB-0200)
  colors: {
    light: { accent: '#1f5f8b', 'on-accent': '#ffffff', part: '#b08a3c' },
    dark:  { accent: '#7db6e2', 'on-accent': '#0f1d27', part: '#9c7a33' }
  },
  materials: { part: { metalness: 0.45, roughness: 0.38 } },
  modes: ['solid', 'xray'],
  camera: { radius: 270, target: [X3 / 2, 0, 0], min: 40, max: 1000 },
  titleBlock: [
    { k: 'Titel', v: 'Sleutel met achtkantgreep zonder aanslag', title: true },
    { k: 'Tekeningnr.', v: 'OCT-0102-A' },
    { k: 'Materiaal', v: 'Messing' },
    { k: 'Eenheden · Schaal', v: 'mm · 1:1', units: 'mm', scale: true },
    { k: 'Algemene toleranties', v: 'ISO 2768-mK' },
    { k: 'Totale lengte', v: '100 (20 + 40 + 40)' },
    { k: 'Variant', v: 'als OCT-0101, zonder aanslag' },
    { k: 'Projectie', v: 'Eerste hoek', projection: true },
    { k: 'Getekend · Blad', v: '2026-11-04 · 1/1' }
  ],
  build(m) {
    const { THREE, V } = m;
    const alongX = (g, x0, len) => { g.rotateZ(-Math.PI / 2); g.translate(x0 + len / 2, 0, 0); return g; };

    // Achtkant: cilinder met 8 zijden, een halve zijde (22,5°) gedraaid zodat er vlakken boven,
    // onder en opzij liggen (y = ±10, z = ±10).
    m.part(alongX(new THREE.CylinderGeometry(RC, RC, OCT.len, 8, 1, false, Math.PI / 8), 0, OCT.len), { edges: 25 });
    // Ronde as Ø8
    m.part(alongX(new THREE.CylinderGeometry(rs, rs, SHAFT.len, 48), X1, SHAFT.len), { edges: 25 });
    // Vierkante staaf 8 × 8
    const bar = new THREE.BoxGeometry(BAR.len, BAR.w, BAR.w);
    bar.translate(X2 + BAR.len / 2, 0, 0);
    m.part(bar, { edges: 25 });

    // Raster (10 mm) onder het onderste vlak van de achtkant
    const grid = new THREE.GridHelper(240, 24, 0xd9dfdb, 0xd9dfdb);
    grid.position.set(X3 / 2, -H - 0.05, 0);
    m.add(grid, { color: 'grid', print: false });

    const d = m.dims({ arrow: 3 });
    const Y1 = -H - 8, Y2 = -H - 17;                 // maatlijnen onder het stuk
    // Deellengtes 20 · 40 · 40 en totale lengte 100
    d.linear({ a: V(0, Y1, 0), b: V(X1, Y1, 0), text: String(OCT.len),
      ext: [[V(X1, -H, 0), V(X1, Y1 - 2, 0)]] });
    d.linear({ a: V(X1, Y1, 0), b: V(X2, Y1, 0), text: String(SHAFT.len),
      ext: [[V(X2, -hb, 0), V(X2, Y1 - 2, 0)]] });
    d.linear({ a: V(X2, Y1, 0), b: V(X3, Y1, 0), text: String(BAR.len),
      ext: [[V(X3, -hb, 0), V(X3, Y1 - 2, 0)]] });
    d.linear({ a: V(0, Y2, 0), b: V(X3, Y2, 0), text: String(X3),
      ext: [[V(0, -H, 0), V(0, Y2 - 2, 0)], [V(X3, Y1, 0), V(X3, Y2 - 2, 0)]] });
    // Sleutelwijdte 20 tussen de evenwijdige vlakken
    d.linear({ a: V(-8, -H, 0), b: V(-8, H, 0), text: 'SW ' + OCT.af,
      ext: [[V(0, -H, 0), V(-10, -H, 0)], [V(0, H, 0), V(-10, H, 0)]] });
    // As en vierkant
    const c45 = Math.SQRT1_2;
    d.leader({ p: V(X1 + 14, rs * c45, rs * c45), e: V(X1 + 6, H + 10, 12), text: 'Ø' + SHAFT.d });
    d.leader({ p: V(X2 + 26, hb, hb), e: V(X2 + 34, H + 10, 16), text: `□ ${BAR.w} × ${BAR.w}` });
  }
});
</script>
